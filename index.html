<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Easy — plan a painting from a photograph</title>
    <meta
      name="description"
      content="Pull a palette out of any image, see its tonal structure, and rebuild it using only the colours you choose. A planning tool for painters, running entirely in your browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:title" content="Colour Easy" />
    <meta
      property="og:description"
      content="Pull a palette out of any image, see its tonal structure, and rebuild it using only the colours you choose."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://coloureasy.com" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Resolve the theme before first paint, otherwise a dark-mode visitor
      // gets a white flash on every load.
      (function () {
        try {
          var saved = localStorage.getItem('coloureasy:theme');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.dataset.theme = saved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
